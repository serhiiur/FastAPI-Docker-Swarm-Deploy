services:

  web:
    image: ${WEB_IMAGE}:${WEB_IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    secrets:
      - source: db_password
        target: /app/secrets/db_password
    configs:
      - source: api_config
        target: /app/configs/api.env
    environment:
      - DB_NAME: ${POSTGRES_DB:-postgres}
      - DB_USER: ${POSTGRES_USER:-postgres}
    deploy:
      replicas: ${WEB_REPLICAS:-2}
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s # wait after a restart to determine whether it was successful
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: ${WEB_CPU_LIMIT:-2.0}
          memory: ${WEB_RAM_LIMIT:-2G}
      placement:
        constraints:
          - "node.labels.tag == worker"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 5

  migrate:
    image: ${WEB_IMAGE}:${WEB_IMAGE_TAG:-latest}
    command: ["alembic", "-c", "src/alembic/alembic.ini", "upgrade", "head"]
    secrets:
      - source: db_password
        target: /app/secrets/db_password
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      placement:
        constraints:
          - "node.labels.tag == manager"

  db:
    image: postgres:16.3-alpine
    secrets:
      - db_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: ${POSTGRES_CPU_LIMIT:-2.0}
          memory: ${POSTGRES_RAM_LIMIT:-4G}
      placement:
        constraints:
          - "node.labels.tag == db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5

  portainer_agent:
    image: portainer/agent:latest
    deploy:
      mode: global # for running on all nodes
      placement:
        constraints:
          - "node.labels.type == fastapi-stack"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9443:9443" # HTTPS UI
      - "9000:9000" # HTTP UI (optional, drop if using only HTTPS)
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.labels.tag == manager"
    volumes:
      - portainer_data:/data

secrets:
  db_password:
    file: ./secrets/db_password.txt

configs:
  api_config:
    file: ./configs/api.env

volumes:
  pg_data:
  portainer_data:
