services:

  web:
    image: alexmahone/fastapi-dockerswarm-test-api:latest
    ports:
      - "8000:8000"
    secrets:
      - source: db_password
        target: /app/secrets/db_password
    configs:
      - source: api_config
        target: /app/configs/api.env
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s # how long to wait before resetting the failure count
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      placement:
        constraints:
          - "node.labels.tag == worker"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 5

  migrate:
    image: alexmahone/fastapi-dockerswarm-test-api:latest
    command: ["alembic", "-c", "src/alembic/alembic.ini", "upgrade", "head"]
    secrets:
      - source: db_password
        target: /app/secrets/db_password
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      placement:
        constraints:
          - "node.labels.tag == manager"

  db:
    image: postgres:16.3-alpine
    secrets:
      - db_password
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pg-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - "node.labels.tag == db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5

  portainer_agent:
    image: portainer/agent:latest
    deploy:
      mode: global # for running on all nodes
      placement:
        constraints:
          - "node.labels.type == fastapi-stack"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9443:9443" # HTTPS UI
      - "9000:9000" # HTTP UI (optional, drop if using only HTTPS)
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.labels.tag == manager"
    volumes:
      - portainer_data:/data

secrets:
  db_password:
    file: ./secrets/db_password.txt

configs:
  api_config:
    file: ./configs/api.env

volumes:
  pg-data:
  portainer_data:
